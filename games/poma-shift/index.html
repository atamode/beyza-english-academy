<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#0b1530" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Poma Shift: satırları temizle, SHIFT ile değişen tahtayı yönet ve Poma karakter güçlerini aç." />
  <title>Poma Shift</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./threat.css" />
  <link rel="stylesheet" href="./poma-brand.css" />
  <link rel="stylesheet" href="./state-palette.css" />
  <link rel="stylesheet" href="./meta-system.css" />
  <link rel="stylesheet" href="./character-art.css" />
  <link rel="stylesheet" href="./launch-polish.css" />
  <link rel="stylesheet" href="./boss-ui.css" />
  <link rel="stylesheet" href="./dev-panel.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div><span class="label">LEVEL</span><strong id="levelValue">1</strong></div>
      <div><span class="label">HAMLE</span><strong id="moveValue">0/18</strong></div>
      <div><span class="label">SHIFT</span><strong id="shiftValue">0/3</strong></div>
      <div><span class="label">TAHTA</span><strong id="boardValue">6×12</strong></div>
    </header>

    <section class="game-card">
      <canvas id="game" aria-label="Poma Shift oyun alanı"></canvas>
    </section>

    <section class="hud">
      <p id="message">3 parçadan birini sürükle ve tahtaya bırak.</p>
      <span id="scoreValue" hidden>0</span>
      <div class="actions">
        <button id="restartBtn" hidden>Tekrar Dene</button>
        <button id="nextBtn" hidden>Sonraki Level</button>
      </div>
    </section>
  </main>
  <script src="./game.js" defer></script>
  <script src="./mobile-layout.js" defer></script>
  <script src="./game-feel.js" defer></script>
  <script src="./rush-disable.js" defer></script>
  <script src="./product-ui.js" defer></script>
  <script src="./win-reveal.js" defer></script>
  <script src="./threat-system.js" defer></script>
  <script src="./timer-heartbeat.js" defer></script>
  <script src="./poma-brand.js" defer></script>
  <script src="./meta-system.js" defer></script>
  <script src="./character-art.js" defer></script>
  <script src="./launch-polish.js" defer></script>
  <script src="./boss-ui.js" defer></script>
  <script src="./timed-level-guard.js" defer></script>
  <script src="./analytics-bridge.js" defer></script>
  <script src="./dev-panel.js" defer></script>
  <script src="./combo-system.js" defer></script>
  <script src="./rush-mode.js" defer></script>
  <script src="./ui-hotfix.js" defer></script>
  <script src="./audio-mix.js" defer></script>
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === '127.0.0.1' || location.hostname === 'localhost')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
