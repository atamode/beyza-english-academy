<!doctype html>
<html lang="tr" class="poma-lobby-boot">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#0b1530" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Poma Shift: satırları temizle, SHIFT ile değişen tahtayı yönet ve Poma karakter güçlerini aç." />
  <title>Poma Shift</title>
  <style>
    html.poma-lobby-boot body::before {
      content: 'POMA SHIFT';
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      padding-bottom: 34px;
      background: radial-gradient(circle at 50% 18%, #173463 0, #0b1732 46%, #050b18 100%);
      color: #eef6ff;
      font: 900 24px/1 system-ui, sans-serif;
      letter-spacing: .08em;
    }
    html.poma-lobby-boot body::after {
      content: 'Yükleniyor…';
      position: fixed;
      left: 0;
      right: 0;
      top: 50%;
      z-index: 10000;
      margin-top: 22px;
      text-align: center;
      color: #9fb5d9;
      font: 700 12px/1 system-ui, sans-serif;
    }
  </style>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css?v=40" />
  <link rel="stylesheet" href="./threat.css?v=40" />
  <link rel="stylesheet" href="./poma-brand.css?v=40" />
  <link rel="stylesheet" href="./state-palette.css?v=40" />
  <link rel="stylesheet" href="./meta-system.css?v=40" />
  <link rel="stylesheet" href="./character-art.css?v=40" />
  <link rel="stylesheet" href="./launch-polish.css?v=40" />
  <link rel="stylesheet" href="./boss-ui.css?v=40" />
  <link rel="stylesheet" href="./dev-panel.css?v=40" />
  <link rel="stylesheet" href="./mobile-release-v2.css?v=40" />
  <link rel="stylesheet" href="./lobby-v1.css?v=44" />
  <script>
    // Launch-candidate web policy: disable the legacy service-worker cache so a deploy
    // cannot strand players on stale gameplay/economy code.
    (() => {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          registrations
            .filter((registration) => registration.scope.includes('/games/poma-shift/'))
            .forEach((registration) => registration.unregister().catch(() => {}));
        }).catch(() => {});
      }
      if ('caches' in window) {
        caches.keys().then((keys) => Promise.all(
          keys.filter((key) => key.startsWith('poma-shift-')).map((key) => caches.delete(key)),
        )).catch(() => {});
      }
      window.setTimeout(() => {
        const root = document.documentElement;
        if (!root.classList.contains('poma-lobby-boot')) return;
        root.classList.remove('poma-lobby-boot');
        root.classList.add('poma-lobby-fallback');
        const message = document.getElementById('message');
        if (message) message.textContent = 'Harita yüklenemedi. Oyun geçici modda açıldı.';
      }, 3500);
    })();
  </script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div><span class="label">LEVEL</span><strong id="levelValue">1</strong></div>
      <div><span class="label">HAMLE</span><strong id="moveValue">0/18</strong></div>
      <div><span class="label">SHIFT</span><strong id="shiftValue">0/3</strong></div>
      <div><span class="label">TAHTA</span><strong id="boardValue">6×12</strong></div>
    </header>
    <section class="game-card">
      <canvas id="game" aria-label="Poma Shift oyun alanı"></canvas>
    </section>
    <section class="hud">
      <p id="message">3 parçadan birini sürükle ve tahtaya bırak.</p>
      <span id="scoreValue" hidden>0</span>
      <div class="actions">
        <button id="restartBtn" hidden>Tekrar Dene</button>
        <button id="nextBtn" hidden>Sonraki Level</button>
      </div>
    </section>
  </main>
  <script src="./game.js?v=40" defer></script>
  <script src="./lobby-v1.js?v=44" defer onerror="document.documentElement.classList.remove('poma-lobby-boot')"></script>
  <script src="./lobby-freeze-v1.js?v=44" defer></script>
  <script src="./mobile-layout.js?v=40" defer></script>
  <script src="./game-feel.js?v=40" defer></script>
  <script src="./rush-disable.js?v=40" defer></script>
  <script src="./product-ui.js?v=40" defer></script>
  <script src="./win-reveal.js?v=40" defer></script>
  <script src="./threat-system.js?v=40" defer></script>
  <script src="./timer-heartbeat.js?v=40" defer></script>
  <script src="./poma-brand.js?v=40" defer></script>
  <script src="./meta-system.js?v=40" defer></script>
  <script src="./character-progression-v2.js?v=45" defer></script>
  <script src="./character-art.js?v=40" defer></script>
  <script src="./launch-polish.js?v=40" defer></script>
  <script src="./boss-ui.js?v=40" defer></script>
  <script src="./timed-level-guard.js?v=40" defer></script>
  <script src="./analytics-bridge.js?v=40" defer></script>
  <script src="./dev-panel.js?v=40" defer></script>
  <script src="./combo-system.js?v=40" defer></script>
  <script src="./rush-mode.js?v=40" defer></script>
  <script src="./rush-continue.js?v=40" defer></script>
  <script src="./rush-runtime-guard.js?v=40" defer></script>
  <script src="./ui-hotfix.js?v=40" defer></script>
  <script src="./audio-mix.js?v=40" defer></script>
  <script src="./fire-compat.js?v=40" defer></script>
  <script src="./mobile-release-v2.js?v=40" defer></script>
  <script src="./result-flow-fix-v1.js?v=46" defer></script>
</body>
</html>
