name: Poma Shift Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'games/poma-shift/**'
      - '.github/workflows/poma-shift-android.yml'

permissions:
  contents: read

concurrency:
  group: poma-shift-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install native dependencies
        working-directory: games/poma-shift/native
        run: npm install --no-audit --no-fund

      - name: Generate Capacitor Android project
        working-directory: games/poma-shift/native
        run: npm run android:add

      - name: Configure safe AdMob test app ID
        working-directory: games/poma-shift/native
        run: node scripts/configure-android-test.mjs

      - name: Build debug APK and unsigned release AAB
        working-directory: games/poma-shift/native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: poma-shift-android-debug
          path: games/poma-shift/native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: poma-shift-android-release-unsigned
          path: games/poma-shift/native/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
