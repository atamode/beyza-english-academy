name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Print Node.js and npm versions
        run: |
          node --version
          npm --version

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify Poma Shift native web + AdMob bridge build
        working-directory: games/poma-shift/native
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Check whitespace errors
        run: git diff --check

      - name: Verify tracked build outputs
        run: git diff --exit-code
