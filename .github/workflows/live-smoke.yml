name: Live Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  workflow_run:
    workflows:
      - Deploy Pomante Pages (clean)
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: live-smoke-${{ github.event.workflow_run.head_branch || github.ref || 'scheduled' }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BASE_URL: https://pomante.com.tr
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run live smoke
        run: npm run test:smoke:live

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-failure
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
