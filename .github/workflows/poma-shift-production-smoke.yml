name: Poma Shift Production Smoke

on:
  workflow_run:
    workflows:
      - Poma Shift Browser Smoke
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: poma-shift-production-smoke-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  production-smoke:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BASE_URL: https://pomante.com.tr
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for Pages deployment
        run: |
          for i in {1..24}; do
            body="$(curl -fsS 'https://pomante.com.tr/games/poma-shift/?production-smoke='${{ github.event.workflow_run.head_sha }} || true)"
            if printf '%s' "$body" | grep -q 'result-flow-fix-v1.js?v=47' && \
               printf '%s' "$body" | grep -q 'rush-continue.js?v=48' && \
               printf '%s' "$body" | grep -q 'unlock-card-v1.js?v=49' && \
               printf '%s' "$body" | grep -q 'boss-ui.js?v=50'; then
              exit 0
            fi
            sleep 5
          done
          echo 'Expected Poma Shift deployment did not reach pomante.com.tr in time.'
          exit 1

      - name: Run deployed Poma Shift Chromium flow
        run: npx playwright test poma-shift-lobby-local.spec.js poma-shift-unlock-local.spec.js poma-shift-boss-local.spec.js --config=playwright.live.config.mjs

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: poma-shift-production-smoke-failure
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
