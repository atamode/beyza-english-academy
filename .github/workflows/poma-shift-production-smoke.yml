name: Poma Shift Production Smoke

on:
  workflow_run:
    workflows:
      - Poma Shift Browser Smoke
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: poma-shift-production-smoke-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  production-smoke:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BASE_URL: https://pomante.com.tr
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for Pages deployment
        run: |
          for i in {1..24}; do
            body="$(curl -fsS 'https://pomante.com.tr/games/poma-shift/?production-smoke='${{ github.event.workflow_run.head_sha }} || true)"
            if printf '%s' "$body" | grep -q 'result-flow-fix-v1.js?v=47' && \
               printf '%s' "$body" | grep -q 'rush-continue.js?v=48' && \
               printf '%s' "$body" | grep -q 'unlock-card-v1.js?v=61' && \
               printf '%s' "$body" | grep -q 'boss-ui.js?v=50' && \
               printf '%s' "$body" | grep -q 'mobile-release-v2.js?v=51' && \
               printf '%s' "$body" | grep -q 'loadout-sync-v1.js?v=51' && \
               printf '%s' "$body" | grep -q 'rush-runtime-guard.js?v=52' && \
               printf '%s' "$body" | grep -q 'analytics-ga4-v1.js?v=53' && \
               printf '%s' "$body" | grep -q 'analytics-bridge.js?v=53' && \
               printf '%s' "$body" | grep -q 'qa-preview-bootstrap-v1.js?v=61' && \
               printf '%s' "$body" | grep -q 'progression-gift-bootstrap-v1.js?v=61' && \
               printf '%s' "$body" | grep -q 'rush-stale-guard-v1.js?v=61' && \
               printf '%s' "$body" | grep -q 'sugar-cloud-lobby-copy-v1.js?v=61' && \
               printf '%s' "$body" | grep -q 'terminal-cloud-fail-v1.js?v=61'; then
              exit 0
            fi
            sleep 5
          done
          echo 'Expected Poma Shift deployment did not reach pomante.com.tr in time.'
          exit 1

      - name: Verify live Volleyball manifest and PWA precache
        run: |
          manifest_url='https://pomante.com.tr/assets/games/poma-volleyball-v1/asset-manifest.json?production-smoke=${{ github.event.workflow_run.head_sha }}'
          curl -fsS --retry 5 --retry-delay 2 "$manifest_url" -o /tmp/poma-volleyball-manifest.json
          node --input-type=module -e "
            import fs from 'node:fs';
            const manifest = JSON.parse(fs.readFileSync('/tmp/poma-volleyball-manifest.json', 'utf8'));
            if (manifest.id !== 'poma-volleyball-v1') throw new Error('Unexpected volleyball manifest id');
            for (const key of ['shotSuccess', 'shotMissed', 'defenceSuccess', 'saveSuccess', 'conceded', 'win', 'lose']) {
              if (!manifest.events?.[key]) throw new Error('Missing volleyball event: ' + key);
            }
          "
          curl -fsS --retry 5 --retry-delay 2 'https://pomante.com.tr/service-worker.js?production-smoke=${{ github.event.workflow_run.head_sha }}' \
            | grep -Fq 'assets/games/poma-volleyball-v1/asset-manifest.json'

      - name: Run deployed Poma Shift Chromium flow
        run: npx playwright test poma-shift-lobby-local.spec.js poma-shift-unlock-local.spec.js poma-shift-boss-local.spec.js poma-shift-power-runtime-local.spec.js poma-shift-analytics-local.spec.js --config=playwright.live.config.mjs

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: poma-shift-production-smoke-failure
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7